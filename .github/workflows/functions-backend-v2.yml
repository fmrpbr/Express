name: Validar backend de notificações V2

on:
  push:
    branches: [v2.0-testes-reais]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions-backend-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do backend
        working-directory: functions
        run: npm ci
      - name: Verificar sintaxe
        working-directory: functions
        run: npm run lint && npm test
