name: Validar V2 e regras Firebase
on:
  push:
    branches: [v2.0-testes-reais]
  pull_request:
    branches: [v2.0-testes-reais]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix tests/firebase-rules
      - run: npm ci --prefix tests/security
      - run: npm run check && npm test
      - run: npm test --prefix tests/firebase-rules
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-browser-emulators.mjs
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: cp www/firebase-config.example.js www/firebase-config.js
      - run: npx cap add android
      - run: cp google-services.json android/app/google-services.json
      - run: node scripts/prepare-android.mjs
      - run: npx cap sync android
      - name: Validar compilação Android sem disponibilizar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
