name: Gerar APK Android

on:
  push:
    branches: [android-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Express Entregas
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Gerar APK de instalação
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Express-Entregas-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
