name: Gerar APK Android - V2 Teste

on:
  push:
    branches: [v2.0-testes-reais]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Express Entregas 2.0 (Teste)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar dependências
        run: npm install

      - name: Preparar configuração Firebase de teste
        run: cp www/firebase-config.example.js www/firebase-config.js

      - name: Preparar ícones personalizados do app
        run: |
          mkdir -p www/icons assets
          cp icons/icon-192.png www/icons/icon-192.png
          cp icons/icon-512.png www/icons/icon-512.png
          cp icons/icon-512.png assets/icon.png

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones nativos personalizados
        run: npx --yes @capacitor/assets@3.0.5 generate --android --assetPath assets --iconBackgroundColor '#EA1D2C' --iconBackgroundColorDark '#EA1D2C'

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Gerar APK de instalação
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Express-Entregas-2.0-TESTE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
