name: Gerar APK Android - V2 Teste
on:
  push:
    branches: [v2.0-testes-reais]
    paths: ['.github/workflows/build-android-apk.yml']
  workflow_dispatch:
    inputs:
      upload_apk:
        description: 'Disponibilizar APK de teste após autorização e validações'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v2.0-testes-reais'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix tests/firebase-rules
      - run: npm ci --prefix tests/security
      - run: npm run check && npm test && npm test --prefix tests/firebase-rules
      - run: npm run build:web
      - run: cp www/firebase-config.example.js www/firebase-config.js
      - run: npx cap add android
      - run: cp google-services.json android/app/google-services.json
      - run: node scripts/prepare-android.mjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: npx cap sync android
      - name: Restaurar assinatura estável dos testes
        if: inputs.upload_apk || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publicar APK V2 de teste autorizado'))
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          key = os.environ.get('ANDROID_TEST_KEYSTORE_BASE64', '')
          if not key:
              raise SystemExit('Configure ANDROID_TEST_KEYSTORE_BASE64 com um debug.keystore estável antes de disponibilizar APKs atualizáveis.')
          path = pathlib.Path.home() / '.android' / 'debug.keystore'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(key, validate=True))
          path.chmod(0o600)
          PY
      - name: Compilar APK Express Entregas Beta 2.0.19
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --init-script ../scripts/central-mirror.init.gradle assembleDebug
      - name: Assinar e verificar APK de teste
        if: inputs.upload_apk || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publicar APK V2 de teste autorizado'))
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out android/app/build/outputs/apk/debug/express-signed.apk android/app/build/outputs/apk/debug/app-debug.apk
          "$APK_SIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/express-signed.apk > /tmp/express-apk-signature.txt
          cat /tmp/express-apk-signature.txt
          grep -Fqi 'd4e736f9a49620a3152b8cc0a506d73f0ca065dd82fb558daf4e7150b5cc75b6' /tmp/express-apk-signature.txt
          mv android/app/build/outputs/apk/debug/express-signed.apk android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: inputs.upload_apk || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publicar APK V2 de teste autorizado'))
        with:
          name: Express-Entregas-2.0-TESTE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
