name: Preparar APK conferido para migração Firebase
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stage-firebase-apk.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: express-public-download
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir e disponibilizar somente o arquivo do APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,os,hashlib,zipfile,io,pathlib
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/14332653191/zip'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          try:
              with urllib.request.build_opener(NoRedirect()).open(urllib.request.Request(api,headers=headers),timeout=60) as r: raw=r.read()
          except urllib.error.HTTPError as error:
              if error.code not in (301,302,303,307,308): raise
              location=error.headers['Location'];url=urllib.parse.urlsplit(location)
              if url.scheme!='https' or not (url.hostname.endswith('.blob.core.windows.net') or url.hostname.endswith('.githubusercontent.com')): raise RuntimeError('Destino inesperado')
              with urllib.request.urlopen(location,timeout=60) as r: raw=r.read()
          assert hashlib.sha256(raw).hexdigest()=='3f6e1ee8a0250fe678199c6aca62a9f84c290467e7555d4fd49370783a80ce68'
          with zipfile.ZipFile(io.BytesIO(raw)) as z: apk=z.read('app-debug.apk')
          assert hashlib.sha256(apk).hexdigest()=='8599761f92777bad027b65854ba70aa06daa97a98d043062f2fd3e6b15263b41'
          with zipfile.ZipFile(io.BytesIO(apk)) as z:
              html=z.read('assets/public/index.html').decode()
              assert 'const APP_VERSION="2.0.16";' in html
              assert 'https://express-v2-web-fmrpbr.web.app/download/' in html
              assert 'https://fmrpbr.github.io/Express/download/' not in html
          p=pathlib.Path('downloads');p.mkdir(exist_ok=True)
          (p/'Express-Entregas-V2-2.0.16-Teste.apk').write_bytes(apk)
          print('APK 2.0.16 conferido para publicação no Firebase.')
          PY
      - name: Guardar o arquivo para a transferência ao Firebase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Express-Entregas-V2-2.0.16-Teste.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Disponibilizar APK 2.0.16 conferido para migração ao Firebase'
            git push origin HEAD:main
          fi
